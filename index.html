<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<meta name="description" content="Privacy policies and support pages for my apps.">
<style>
  :root { --bg: #fafbff; --text: #1b2240; --muted: #4f5878; --card: #ffffff; --line: #e3e6f2; --accent: #2f5bea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1324; --text: #e8ebf7; --muted: #a9b0c9; --card: #171c31; --line: #2a3150; --accent: #8fa8ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 18px 64px; }
  h1 { font-size: 34px; margin: 0 0 4px; line-height: 1.2; }
  .muted { color: var(--muted); margin: 0 0 28px; }
  ul.apps { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  ul.apps li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; display: flex; align-items: center; gap: 16px; }
  ul.apps img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
  .name { font-weight: 600; font-size: 19px; }
  .links { font-size: 15.5px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <p class="muted">Privacy policies and support pages for my apps.</p>
  <ul class="apps">
    <li>
      <img src="pixelyt/icon.png" alt="">
      <div>
        <div class="name"><a href="pixelyt/">Pixelyt</a></div>
        <div class="muted" style="margin:0">Private, offline gallery organiser for Android</div>
        <div class="links"><a href="pixelyt/privacy.html">Privacy policy</a></div>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
